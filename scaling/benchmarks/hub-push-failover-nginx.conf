upstream push_test_hubs {
    server host.docker.internal:54110 max_fails=1 fail_timeout=2s;
    server host.docker.internal:54111 max_fails=1 fail_timeout=2s;
}
server {
    listen 5100;
    proxy_connect_timeout 1s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    location / {
        proxy_pass http://push_test_hubs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
    }
}
