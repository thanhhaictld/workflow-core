# Opt-in A/B/C/D native commit profile; upgrade both Hub replicas before enabling compact receipt.
services:
  hub:
    environment:
      WFC_HUB_NATIVE_SKIP_EMPTY_SUBS_SQL: "${WFC_HUB_NATIVE_SKIP_EMPTY_SUBS_SQL:-true}"
      WFC_HUB_NATIVE_BULK_EVENT_SQL: "${WFC_HUB_NATIVE_BULK_EVENT_SQL:-true}"
      WFC_HUB_NATIVE_BULK_ACTIVITIES: "${WFC_HUB_NATIVE_BULK_ACTIVITIES:-true}"
      WFC_HUB_NATIVE_COMPACT_RECEIPT: "${WFC_HUB_NATIVE_COMPACT_RECEIPT:-true}"
  hub-2:
    environment:
      WFC_HUB_NATIVE_SKIP_EMPTY_SUBS_SQL: "${WFC_HUB_NATIVE_SKIP_EMPTY_SUBS_SQL:-true}"
      WFC_HUB_NATIVE_BULK_EVENT_SQL: "${WFC_HUB_NATIVE_BULK_EVENT_SQL:-true}"
      WFC_HUB_NATIVE_BULK_ACTIVITIES: "${WFC_HUB_NATIVE_BULK_ACTIVITIES:-true}"
      WFC_HUB_NATIVE_COMPACT_RECEIPT: "${WFC_HUB_NATIVE_COMPACT_RECEIPT:-true}"
