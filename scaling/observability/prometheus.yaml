global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: workflow-otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: postgres-process
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-process-exporter:9256"]
