# Diagnostic-only collector. Activated with OTEL_COLLECTOR_CONFIG=otel-collector-diagnostic.yaml.
# Captures complete OTLP traces and high-resolution metrics for CI postmortems.
# Never enable file capture for real tenant payloads in production.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/tempo:
    endpoint: http://tempo:4318
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  file/diagnostic_traces:
    path: /results/p99-otel-traces.jsonl
    format: json
    flush_interval: 1s
  file/diagnostic_metrics:
    path: /results/p99-otel-metrics.jsonl
    format: json
    flush_interval: 1s

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, file/diagnostic_metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo, file/diagnostic_traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
