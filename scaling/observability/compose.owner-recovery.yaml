# Standalone suite: do not layer onto compose.yaml or reuse its project/volumes.
name: ${OWNER_RECOVERY_PROJECT:?Use scripts/owner-recovery.ps1 or the Make targets}

x-owned: &owned
  cadence.owner-suite: ${OWNER_RECOVERY_PROJECT}
x-hub-env: &hub-env
  ASPNETCORE_URLS: http://0.0.0.0:5100
  WFC_PG: Host=pg;Database=workflow;Username=workflow;Password=${OWNER_RECOVERY_PG_PASSWORD:-owner_lab_only};Maximum Pool Size=12
  WFC_HUB_AUTH_TOKEN: ${OWNER_RECOVERY_TOKEN:-owner-lab-development-only}
  WFC_HUB_MATCHING_ENABLED: "true"
  WFC_HUB_MATCHING_PARTITIONS: "4"
  WFC_HUB_MATCHING_PEERS: http://hub:5100,http://hub-2:5100
  WFC_HUB_MATCHING_EVENT_GATED: "true"
  WFC_HUB_CLAIM_ADMISSION_ENABLED: "true"
  WFC_HUB_CLAIM_ADMISSION_MODE: demand
  WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS: "true"
  WFC_HUB_PG_NOTIFY_ENABLED: "${OWNER_RECOVERY_NOTIFY:-true}"
  WFC_HUB_OWNER_DIAGNOSTICS: "${OWNER_RECOVERY_DIAGNOSTICS:-false}"
  WorkflowHub__Scheduler__Enabled: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "1000"
x-hub-health: &hub-health
  test: [CMD, /bin/bash, -c, "echo > /dev/tcp/127.0.0.1/5100"]
  interval: 2s
  timeout: 3s
  retries: 40
  start_period: 10s
x-pg-env: &pg-env
  POSTGRES_USER: workflow
  POSTGRES_PASSWORD: ${OWNER_RECOVERY_PG_PASSWORD:-owner_lab_only}
  POSTGRES_DB: workflow
x-pg-health: &pg-health
  test: [CMD-SHELL, "pg_isready -U workflow -d workflow"]
  interval: 2s
  timeout: 3s
  retries: 40
x-migration: &migration
  image: postgres:17
  labels: *owned
  volumes:
    - ../sql:/sql:ro
  environment:
    PGPASSWORD: ${OWNER_RECOVERY_PG_PASSWORD:-owner_lab_only}
  entrypoint: [/bin/sh, -ec]
  command:
    - |
      for migration in /sql/*.sql; do
        echo "Applying $$migration"
        psql -X -h "$$PGHOST" -U workflow -d workflow -v ON_ERROR_STOP=1 -f "$$migration"
      done
      psql -X -h "$$PGHOST" -U workflow -d workflow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
  restart: "no"

services:
  pg:
    image: postgres:17
    labels: *owned
    environment: *pg-env
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, compute_query_id=on]
    healthcheck: *pg-health
    ports:
      - "127.0.0.1:${OWNER_RECOVERY_PG_PORT:-26440}:5432"
    volumes:
      - workflow_pg:/var/lib/postgresql/data

  migrate:
    <<: *migration
    environment:
      PGPASSWORD: ${OWNER_RECOVERY_PG_PASSWORD:-owner_lab_only}
      PGHOST: pg
    depends_on:
      pg:
        condition: service_healthy

  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    labels: *owned
    command: [--config=/etc/owner-lab.yaml]
    volumes:
      - ./benchmark/owner-lab-collector.yaml:/etc/owner-lab.yaml:ro
    ports:
      - "127.0.0.1:${OWNER_RECOVERY_METRICS_PORT:-26289}:8889"

  hub:
    image: ${OWNER_RECOVERY_PROJECT}-hub:local
    labels: *owned
    build:
      context: ../..
      dockerfile: scaling/observability/Dockerfile.owner-recovery
      target: hub
    command: [WorkflowCore.Hub.Server.dll]
    environment:
      <<: *hub-env
      WFC_HUB_MATCHING_NODE_ID: hub-a
      WFC_HUB_MATCHING_ADVERTISE_URL: http://hub:5100
      OTEL_SERVICE_INSTANCE_ID: hub-a
    depends_on:
      migrate:
        condition: service_completed_successfully
      collector:
        condition: service_started
    healthcheck: *hub-health
    ports:
      - "127.0.0.1:${OWNER_RECOVERY_HUB_PORT:-26200}:5100"

  hub-2:
    image: ${OWNER_RECOVERY_PROJECT}-hub:local
    labels: *owned
    command: [WorkflowCore.Hub.Server.dll]
    environment:
      <<: *hub-env
      WFC_HUB_MATCHING_NODE_ID: hub-b
      WFC_HUB_MATCHING_ADVERTISE_URL: http://hub-2:5100
      OTEL_SERVICE_INSTANCE_ID: hub-b
    depends_on:
      hub:
        condition: service_healthy
    healthcheck: *hub-health
    ports:
      - "127.0.0.1:${OWNER_RECOVERY_HUB2_PORT:-26201}:5100"

  lb:
    image: nginx:1.29-alpine
    labels: *owned
    volumes:
      - ./nginx.matching-ha.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${OWNER_RECOVERY_LB_PORT:-26210}:5100"
    depends_on:
      hub:
        condition: service_healthy
      hub-2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:5100/health/ready]
      interval: 2s
      timeout: 3s
      retries: 40

  processor:
    image: ${OWNER_RECOVERY_PROJECT}-processor:local
    labels: *owned
    build:
      context: ../..
      dockerfile: scaling/observability/Dockerfile.owner-recovery
      target: processor
    deploy:
      replicas: 4
    command: [WorkflowCore.Offboarding.Processor.dll]
    depends_on:
      lb:
        condition: service_healthy
    environment:
      WFC_HUB_URL: http://lb:5100
      WFC_HUB_AUTH_TOKEN: ${OWNER_RECOVERY_TOKEN:-owner-lab-development-only}
      WFC_HUB_ALLOW_INSECURE_HTTP: "true"
      WORKFLOW_WORKERS: "8"
      ACTIVITY_WORKERS: "8"
      WFC_HUB_MATCHING_PARTITIONS: "4"
      WFC_HUB_TASK_SSE_PUSH: "true"
      WFC_HUB_LONG_POLL_ENABLED: "true"
      POLICY_BENCHMARK_ENABLED: "true"
      POLICY_BENCHMARK_ONLY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: "1000"

  test-pg:
    profiles: [tests]
    image: postgres:17
    labels: *owned
    environment: *pg-env
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements]
    healthcheck: *pg-health
    volumes:
      - test_pg:/var/lib/postgresql/data

  test-migrate:
    <<: *migration
    profiles: [tests]
    environment:
      PGPASSWORD: ${OWNER_RECOVERY_PG_PASSWORD:-owner_lab_only}
      PGHOST: test-pg
    depends_on:
      test-pg:
        condition: service_healthy

  tests:
    profiles: [tests]
    image: ${OWNER_RECOVERY_PROJECT}-tests:local
    labels: *owned
    build:
      context: ../..
      dockerfile: scaling/observability/Dockerfile.owner-recovery
      target: tests
    environment:
      WFC_TEST_PG: Host=test-pg;Database=workflow;Username=workflow;Password=${OWNER_RECOVERY_PG_PASSWORD:-owner_lab_only};Maximum Pool Size=40
    volumes:
      - ${OWNER_RECOVERY_RESULTS:-../../artifacts/owner-recovery}/tests:/results
    depends_on:
      test-migrate:
        condition: service_completed_successfully

volumes:
  workflow_pg:
  test_pg:
