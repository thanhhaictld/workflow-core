# Docker can assign new addresses when Hub containers are recreated. Keep the
# load balancer's upstreams current even if nginx itself stays running.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream workflow_hub_gateways {
    zone workflow_hub_gateways 64k;
    least_conn;
    server hub:5100 resolve max_fails=1 fail_timeout=3s;
    server hub-2:5100 resolve max_fails=1 fail_timeout=3s;
    keepalive 32;
}
server {
    listen 5100;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_connect_timeout 2s;
    # Long-lived SSE task leases must be forwarded immediately, without
    # proxy buffering or mid-stream upstream retries. Owner fencing is in SQL.
    location = /api/hub/workers/tasks:stream {
        proxy_pass http://workflow_hub_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass http://workflow_hub_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
