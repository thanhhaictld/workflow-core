<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1450" viewBox="0 0 1920 1450" role="img" aria-labelledby="title desc">
<title id="title">Workflow Core multi-Hub matching, committed task admission and asynchronous SSE push</title>
<desc id="desc">Illustrates PostgreSQL-owned matching shards distributed across two Hubs, bounded candidate admissions, worker push-session registration, SSE task assignment, REST completion, and shard failover. Includes the alternate per-shard SSE protocol.</desc>
<defs>
 <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2865aa"/></marker>
 <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#0d8d79"/></marker>
 <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#8855b9"/></marker>
 <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bd7030"/></marker>
</defs>
<rect width="1920" height="1450" fill="#f8fafc"/>
<rect x="0" y="0" width="1920" height="98" fill="#0e2443"/>

<text x="50" y="54" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start">Multi-Hub matching + durable admission + asynchronous SSE</text>
<text x="52" y="83" fill="#d3e2f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start">CURRENT MVP  •  feat/hub-parallel-shard-admission-mvp  •  primary push-session transport</text>
<text x="52" y="135" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">1   SHARDED OWNERSHIP &amp; PARALLEL DISPATCH</text>
<rect x="48" y="166" width="280" height="239" rx="16" fill="#e9f1ff" stroke="#9fbbe3" stroke-width="2"/>
<text x="68" y="201" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Workflow producers</text>
<text x="68" y="237" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">REST start workflow</text>
<text x="68" y="267" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Scheduler marks task ready</text>
<text x="68" y="297" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Commit task + readiness</text>
<text x="68" y="327" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Never send work in-memory</text>
<rect x="376" y="166" width="305" height="239" rx="16" fill="#edf8f6" stroke="#77b8ab" stroke-width="2"/>
<text x="396" y="201" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="396" y="237" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">hub_task + task lease epoch</text>
<text x="396" y="267" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Matching owner + owner epoch</text>
<text x="396" y="297" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Attempts / workflow history</text>
<text x="396" y="327" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Durable recovery after failure</text>
<rect x="739" y="166" width="320" height="239" rx="16" fill="#eef4ff" stroke="#669bd1" stroke-width="2"/>
<text x="759" y="201" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Hub A (example)</text>
<text x="759" y="237" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Owns shards 0 and 2</text>
<text x="759" y="267" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">In-memory candidates + credits</text>
<text x="759" y="297" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Parallel discovery per shard</text>
<text x="759" y="327" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Bounded admitted claims</text>
<text x="759" y="357" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Claims use owner FOR SHARE</text>
<rect x="1091" y="166" width="320" height="239" rx="16" fill="#eef4ff" stroke="#669bd1" stroke-width="2"/>
<text x="1111" y="201" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Hub B (example)</text>
<text x="1111" y="237" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Owns shards 1 and 3</text>
<text x="1111" y="267" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Independent in-memory matching</text>
<text x="1111" y="297" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">No cluster-wide process lock</text>
<text x="1111" y="327" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Other shards claim concurrently</text>
<text x="1111" y="357" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Owner epoch is SQL fenced</text>
<rect x="1470" y="166" width="399" height="239" rx="16" fill="#f2edff" stroke="#a889ce" stroke-width="2"/>
<text x="1490" y="201" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Gateway + remote workers</text>
<text x="1490" y="237" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Worker may reach any Hub</text>
<text x="1490" y="267" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Non-owner replies 409 + ownerUrl</text>
<text x="1490" y="297" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Worker opens SSE at owner</text>
<text x="1490" y="327" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Each lane reports local free slots</text>
<text x="1490" y="357" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">REST heartbeat + completion</text>
<path d="M 329 281 L 373 281" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<path d="M 681 263 L 736 263" fill="none" stroke="#0d8d79" stroke-width="3"  marker-end="url(#greenArrow)"/>
<path d="M 681 341 L 1087 341" fill="none" stroke="#0d8d79" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#greenArrow)"/>
<path d="M 1415 279 L 1466 279" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<text x="898" y="437" fill="#225a54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">POSTGRESQL IS AUTHORITATIVE  •  Shard owners can change; committed task leases persist</text>
<text x="52" y="495" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">2   PRIMARY PUSH-SESSION PROTOCOL (worker lane bound to one shard at a time)</text>
<rect x="48" y="520" width="1824" height="580" rx="18" fill="#ffffff" stroke="#d1dfef" stroke-width="2"/>
<rect x="44" y="540" width="340" height="49" rx="12" fill="#ddf8ef" stroke="#a7c2d9"/>
<text x="214" y="571" fill="#203550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Worker lane</text>
<path d="M 214 593 L 214 1066" stroke="#b7c7d9" stroke-width="2" stroke-dasharray="7 8"/>
<rect x="465" y="540" width="340" height="49" rx="12" fill="#e5efff" stroke="#a7c2d9"/>
<text x="635" y="571" fill="#203550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Gateway / Load balancer</text>
<path d="M 635 593 L 635 1066" stroke="#b7c7d9" stroke-width="2" stroke-dasharray="7 8"/>
<rect x="954" y="540" width="340" height="49" rx="12" fill="#e5efff" stroke="#a7c2d9"/>
<text x="1124" y="571" fill="#203550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Current shard owner Hub</text>
<path d="M 1124 593 L 1124 1066" stroke="#b7c7d9" stroke-width="2" stroke-dasharray="7 8"/>
<rect x="1433" y="540" width="340" height="49" rx="12" fill="#dff2ee" stroke="#a7c2d9"/>
<text x="1603" y="571" fill="#203550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">PostgreSQL</text>
<path d="M 1603 593 L 1603 1066" stroke="#b7c7d9" stroke-width="2" stroke-dasharray="7 8"/>
<circle cx="79" cy="620" r="16" fill="#1e65aa"/>
<text x="79" y="626" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
<text x="109" y="625" fill="#29415f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Register</text>
<path d="M 381 625 L 461 625" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<text x="388" y="615" fill="#24568e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">POST push-sessions</text>
<path d="M 806 625 L 949 625" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<text x="812" y="614" fill="#24568e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">409 + ownerUrl</text>
<path d="M 381 647 L 955 647" fill="none" stroke="#2865aa" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blueArrow)"/>
<text x="510" y="666" fill="#4c6080" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Worker re-POSTs to the owning Hub; receives sessionId + ownerEpoch</text>
<circle cx="79" cy="703" r="16" fill="#1e65aa"/>
<text x="79" y="709" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
<text x="109" y="708" fill="#29415f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Open SSE</text>
<path d="M 381 708 L 951 708" fill="none" stroke="#8855b9" stroke-width="3"  marker-end="url(#purpleArrow)"/>
<text x="471" y="700" fill="#725398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">GET /workers/push-sessions/{id}/events  (long-lived SSE)</text>
<circle cx="79" cy="777" r="16" fill="#1e65aa"/>
<text x="79" y="783" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">3</text>
<text x="109" y="782" fill="#29415f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Capacity</text>
<path d="M 381 785 L 951 785" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<text x="486" y="776" fill="#24568e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">PUT /workers/push-sessions/{id}/capacity</text>
<text x="503" y="807" fill="#697b92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">free credits + received/released delivery IDs</text>
<circle cx="79" cy="864" r="16" fill="#1e65aa"/>
<text x="79" y="870" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">4</text>
<text x="109" y="869" fill="#29415f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Match + commit</text>
<rect x="950" y="833" width="326" height="65" rx="9" fill="#f2eaff" stroke="#b49ada"/>
<text x="965" y="858" fill="#58398a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Reserve worker credit</text>
<text x="965" y="883" fill="#58398a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Take matched candidate(s)</text>
<path d="M 1281 867 L 1432 867" fill="none" stroke="#0d8d79" stroke-width="3"  marker-end="url(#greenArrow)"/>
<text x="1291" y="854" fill="#136b60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">SQL claim + COMMIT</text>
<path d="M 1431 892 L 1281 892" fill="none" stroke="#0d8d79" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#greenArrow)"/>
<text x="1291" y="919" fill="#136b60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Durable lease + history</text>
<circle cx="79" cy="945" r="16" fill="#1e65aa"/>
<text x="79" y="951" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">5</text>
<text x="109" y="950" fill="#29415f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">SSE push</text>
<path d="M 952 946 L 385 946" fill="none" stroke="#8855b9" stroke-width="3"  marker-end="url(#purpleArrow)"/>
<text x="488" y="937" fill="#725398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">SSE: event task.assigned {task, sessionId, deliveryId}</text>
<text x="445" y="972" fill="#725398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Hub awaits WriteAsync + FlushAsync, NOT the business execution</text>
<path d="M 47 993 L 1872 993" stroke="#cf4b4b" stroke-width="3" stroke-dasharray="12 7"/>
<rect x="742" y="978" width="380" height="32" rx="12" fill="#fff3f3" stroke="#cf4b4b"/>
<text x="932" y="1000" fill="#ad3333" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">ASYNC WORKER EXECUTION BOUNDARY</text>
<circle cx="79" cy="1036" r="16" fill="#1e65aa"/>
<text x="79" y="1042" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">6</text>
<text x="109" y="1041" fill="#29415f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Execute + complete</text>
<path d="M 381 1043 L 461 1043" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<text x="409" y="1032" fill="#24568e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">REST result</text>
<path d="M 807 1043 L 1431 1043" fill="none" stroke="#2865aa" stroke-width="3"  marker-end="url(#blueArrow)"/>
<text x="875" y="1033" fill="#24568e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">POST /api/hub/tasks/{taskId}/complete (gateway persists)</text>
<text x="52" y="1137" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">3   FAILURE &amp; ALTERNATIVE TRANSPORT</text>
<rect x="48" y="1164" width="873" height="198" rx="16" fill="#fff3e7" stroke="#e5a86e" stroke-width="2"/>
<text x="68" y="1202" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Owner failover and lost SSE</text>
<text x="68" y="1238" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Owner row lease expires  →  another Hub acquires a new owner epoch.</text>
<text x="68" y="1268" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Worker reconnects and re-advertises credit to the new shard owner.</text>
<text x="68" y="1298" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">If SSE fails after COMMIT, the task remains leased; never immediately reassign.</text>
<text x="68" y="1328" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Worker execution can finish via REST independently of the SSE connection.</text>
<rect x="956" y="1164" width="916" height="198" rx="16" fill="#f3ebff" stroke="#b299d5" stroke-width="2"/>
<text x="976" y="1202" fill="#152641" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Alternative SSE transport (opt-in)</text>
<text x="976" y="1238" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">WFC_HUB_TASK_SSE_PUSH: one POST /workers/tasks:stream per shard.</text>
<text x="976" y="1268" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">POST /workers/tasks:credit grants a one-shot credit on the right owner.</text>
<text x="976" y="1298" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Events: task.leased (accepted lease) and credit.unused (no eligible task).</text>
<text x="976" y="1328" fill="#334865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Worker-wide credit coordinator ensures no shard overbooks the same slot.</text>
<rect x="48" y="1383" width="1824" height="45" rx="12" fill="#0e2443"/>
<text x="961" y="1412" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">SQL commits first   |   SSE I/O is async   |   completion is separate REST   |   delivery is at-least-once, not exactly-once</text>
</svg>