name: PR41 one-time master merge validation
on:
  push:
    branches:
      - 'thanhhaictld/hub-memory-candidates-luna'
    paths:
      - '.github/workflows/pr41-merge-master-once.yml'
permissions:
  contents: write
jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_dev_only
          POSTGRES_DB: workflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      WFC_TEST_PG: Host=localhost;Port=5432;Database=workflow;Username=workflow;Password=workflow_dev_only
      PGPASSWORD: workflow_dev_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Merge master, preserving PR41 changes in textual conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master
          set +e
          git merge --no-commit --no-ff -X ours origin/master
          merge_rc=$?
          set -e
          echo "Initial merge status: $merge_rc"
          # master replaced the legacy SSE distributor with multiplexed push;
          # retain the deletion rather than resurrect removed implementations.
          for path in \
            scaling/src/WorkflowCore.Hub.Gateway/HubSseTaskDistributor.cs \
            scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/HubSseOwnerRoutingTests.cs; do
            if test -n "$(git ls-files -u -- "$path")"; then
              git rm -f -- "$path"
            fi
          done
          echo "Remaining unresolved paths:"
          git diff --name-only --diff-filter=U
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git diff --cached --stat | tail -25
      - name: Apply distributed runtime schema
        run: |
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/002_distributed_runtime.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/003_signal_delivery.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/004_request_dedupe.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/005_execution_history.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/006_definition_versions.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/007_hub_gateway.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/008_hub_workflows.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/009_hub_task_attempts.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/010_hub_remote_scheduler.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/011_hub_monitor_sample.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/012_hub_native_runtime.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/013_activity_policy_revision.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/014_hub_work_ready_notifications.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/015_explicit_activity_ordering.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/016_hub_matching_ownership.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/017_hub_matching_capability_hints.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/018_hub_matching_partition_ownership.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/019_hub_matching_partition_hints.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/020_hub_reconciliation_indexes.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/021_hub_active_task_indexes.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/022_hub_claim_index_selectivity.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/024_hub_native_reconcile_tasks.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/028_hub_claim_shard4_ready.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/029_hub_partition_candidate_indexes.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/030_hub_notification_outbox.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/031_hub_retire_compatibility_claim_indexes.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/032_hub_candidate_task_id_hints.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/033_hub_business_compatibility.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/034_hub_task_admission.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/035_hub_ready_notifications.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/036_hub_lightweight_shard_signals.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/037_hub_bound_expired_candidate_pages.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/038_hub_bound_ready_due_candidate_pages.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/039_hub_retire_task_operations_index.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/040_hub_remove_exact_task_id_hints.sql
      - name: Reconcile native obsolete-dispatch cancellation semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          path = Path('scaling/src/WorkflowCore.Hub/HubNativeWorkflowStore.cs')
          merged = path.read_text()
          master = check_output(['git','show','origin/master:'+str(path)], text=True)
          start_merged = merged.index('        foreach(var consumed in request.ConsumedInbox.Distinct())')
          end_marker = '        if(request.Status is "Runnable" or "Suspended")'
          end_merged = merged.index(end_marker,start_merged)
          start_master = master.index('        var obsoleteDispatches = request.ObsoleteDispatches')
          end_master = master.index(end_marker,start_master)
          path.write_text(merged[:start_merged] + master[start_master:end_master] + merged[end_merged:])
          PY
      - name: Reconcile gateway and worker architectural replacement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          def show(ref,path):
              return check_output(['git','show',ref+':'+path], text=True)
          workers = 'scaling/src/WorkflowCore.RemoteExecution/HubRuntimeWorkers.cs'
          # The master worker implementation is now multiplexed push rather
          # than the PR's removed SSE credit coordination abstractions.
          Path(workers).write_text(show('origin/master',workers))
          gateway = 'scaling/src/WorkflowCore.Hub.Gateway/HubGatewayEndpoints.cs'
          # New master owns routing through multiplexed push. The old
          # tasks:poll route depends on deleted forwarding APIs; keep the new
          # gateway implementation intact instead of reviving it.
          Path(gateway).write_text(show('origin/master',gateway))
          PY
      - name: Align PostgreSQL readiness listener with retired task-ID hints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          for path in [
              'scaling/src/WorkflowCore.Hub.Gateway/HubCandidateAcquisition.cs',
              'scaling/src/WorkflowCore.Hub.Gateway/PostgresHubNotificationListener.cs',
              'scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/HubPostgresNotificationTests.cs',
              'scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/HubNotificationOutboxTests.cs',
              'scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/HubCandidateAcquisitionRuntimeTests.cs',
          ]:
              Path(path).write_text(check_output(['git','show','origin/master:'+path], text=True))
          PY
      - name: Build merged scaling solution
        run: dotnet build scaling/WorkflowCore.Scaling.slnx -c Release --nologo
      - name: Test multiplexed push recovery before full suite
        run: dotnet test scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/WorkflowCore.Scaling.PostgreSQL.Tests.csproj -c Release --no-build --nologo --filter "FullyQualifiedName~HubMultiplexedPushTests.AmbiguousCommitAndDisconnectHoldCreditAcrossOwnerIncarnationUntilLeaseExpires"
      - name: Test merged scaling suite
        run: dotnet test scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/WorkflowCore.Scaling.PostgreSQL.Tests.csproj -c Release --no-build --nologo
      - name: Commit and push verified merge to PR41 branch
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN has no workflows scope. Keep the workflow subtree
          # identical to the existing PR head in this merge commit; changes
          # needed there are applied afterward with the authorized connector.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m "Merge master into PR41 candidate discovery branch"
          git push origin HEAD:refs/heads/thanhhaictld/hub-memory-candidates-luna
