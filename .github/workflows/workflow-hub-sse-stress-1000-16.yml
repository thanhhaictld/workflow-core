name: Workflow Hub SSE Stress - 1000 Workflows 16 Processors

on:
  pull_request:
    paths:
      - '.github/workflows/workflow-hub-sse-stress-1000-16.yml'
  workflow_dispatch:

concurrency:
  group: workflow-hub-sse-stress-1000-16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary launcher for the new A/B workflow without modifying master.
  # The registered workflow on the default branch is manually dispatchable.
  indexed-bucket-ab:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/workflow-hub-indexed-bucket-ab.yml

  sse-stress-1000-16:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE: scaling/observability/compose.yaml
      HA: scaling/observability/compose.matching-ha.yaml
      SHARDS: scaling/observability/compose.matching-shards.yaml
      ENVFILE: scaling/observability/.env.example
      WFC_HUB_TASK_SSE_PUSH: 'true'
      WFC_HUB_WORKER_CAPACITY_FANOUT: 'false'
      WFC_HUB_LONG_POLL_ENABLED: 'true'
      WFC_HUB_MATCHING_EVENT_GATED: 'true'
      WFC_HUB_MATCHING_PARTITIONS: '4'
      WFC_HUB_CLAIM_ADMISSION_ENABLED: 'true'
      WFC_HUB_CLAIM_ADMISSION_MODE: 'demand'
      WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS: 'true'
      WFC_HUB_FIFO_HEAD_PREFILTER_ENABLED: 'false'
      WFC_HUB_VERIFY_URL: 'http://127.0.0.1:5110'
      OFFBOARD_PROCESSOR_WORKERS: '8'
      POLICY_BENCHMARK_ENABLED: 'false'
      POLICY_BENCHMARK_ONLY: 'false'
      K6_OFFBOARD_COUNT: '1000'
      K6_OFFBOARD_VUS: '200'
      K6_OFFBOARD_TIMEOUT_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4

      - name: Record runner capacity and validate Compose overlays
        run: |
          set -euo pipefail
          echo "CPU cores: $(nproc)"
          free -h
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" config --quiet
          echo "RUN_ID=sse-stress-1000-16-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p scaling/observability/results/sse-stress-1000-16
          chmod 0777 scaling/observability/results scaling/observability/results/sse-stress-1000-16

      - name: Start two Hub replicas and shared PostgreSQL
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" up -d --build hub hub-2 hub-lb prometheus
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5110/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail-with-body -fsS http://127.0.0.1:5110/health/ready

      - name: Start exactly 16 native offboarding processors with SSE push
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            up -d --build --no-deps --scale processor=16 processor
          count="$(docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load ps -q processor | wc -l | tr -d ' ')"
          echo "Processor containers running: $count"
          test "$count" -eq 16
          for i in {1..60}; do
            docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
              --env-file "$ENVFILE" --profile offboarding-load logs --no-color \
              processor > /tmp/sse-stress-processors.log 2>&1
            registered="$(grep -c 'SSE task push enabled' /tmp/sse-stress-processors.log || true)"
            if test "$registered" -ge 16; then break; fi
            sleep 2
          done
          grep -q 'SSE task push enabled' /tmp/sse-stress-processors.log
          echo "SSE task push worker startup messages: $registered"
          test "$registered" -ge 16

      - name: Run 1,000-workflow k6 stress while sampling PostgreSQL and CPU
        run: |
          set -euo pipefail
          out=scaling/observability/results/sse-stress-1000-16
          python3 .github/scripts/sample_dispatch_pressure.py \
            --output "$out/pressure.json" --interval 1 > "$out/pressure.log" 2>&1 &
          probe=$!
          finish() {
            kill -TERM "$probe" 2>/dev/null || true
            wait "$probe" || true
          }
          trap finish EXIT
          sleep 2
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-k6 \
            run --rm --no-deps \
            -e K6_OFFBOARD_COUNT=1000 \
            -e K6_OFFBOARD_VUS=200 \
            -e K6_OFFBOARD_TIMEOUT_SECONDS=900 \
            -e K6_OFFBOARD_RUN_ID="$RUN_ID" \
            k6-offboarding 2>&1 | tee "$out/k6.log"
          finish
          trap - EXIT
          cp scaling/observability/results/k6-offboarding-summary.json "$out/k6-summary.json"
          test -s "$out/pressure.json"

      - name: Verify 1,000 durable completions and output performance metrics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          root=pathlib.Path("scaling/observability/results/sse-stress-1000-16")
          token=next(row.partition("=")[2].strip() for row in
              pathlib.Path("scaling/observability/.env.example").read_text().splitlines()
              if row.startswith("WFC_HUB_AUTH_TOKEN="))
          run=os.environ["RUN_ID"]
          url="http://127.0.0.1:5110/api/hub/runs/"+run+"/summary"
          with urllib.request.urlopen(urllib.request.Request(
              url,headers={"Authorization":"Bearer "+token}),timeout=45) as response:
              result=json.load(response)
          assert result["total"]==result["completed"]==1000 and result["failed"]==0, result
          from datetime import datetime
          def ts(value): return datetime.fromisoformat(value.replace("Z","+00:00"))
          elapsed=(ts(result["lastCompletedAt"])-ts(result["firstCreatedAt"])).total_seconds()
          pressure=json.loads((root/"pressure.json").read_text())
          commits=(pressure.get("dbDelta") or {}).get("xact_commit")
          report={
              "runId":run,"transport":"server-pushed-SSE",
              "hubs":2,"matchingShards":4,"processorReplicas":16,
              "workflowSlotsPerProcessor":8,"k6VUs":200,"submitted":result["total"],
              "completed":result["completed"],"failed":result["failed"],
              "workflowType":"tenant-offboarding-fast","elapsedSeconds":round(elapsed,3),
              "workflowThroughputPerSecond":round(1000/elapsed,3),
              "workflowP95Ms":result["p95CompletionMs"],"workflowP99Ms":result["p99CompletionMs"],
              "cpuBusyPercent":pressure.get("hostCpuBusyPercent"),
              "pgCommitsPerWorkflow":None if commits is None else round(commits/1000,3),
              "postgresWaitSamples":pressure.get("sampledPgWaitBackendCounts"),
              "samplerErrors":pressure.get("errors"),
              "limitations":"Shared GitHub runner CPU; no long-poll control; CPU includes Hub, PostgreSQL, k6 and processors"
          }
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload stress logs and PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-hub-sse-stress-1000-16
          path: scaling/observability/results/sse-stress-1000-16/
          if-no-files-found: warn

      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            ps -a || true
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            logs --tail=150 hub hub-2 hub-lb processor postgres || true

      - name: Cleanup without deleting PostgreSQL volumes
        if: always()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            --profile offboarding-k6 down --remove-orphans || true
