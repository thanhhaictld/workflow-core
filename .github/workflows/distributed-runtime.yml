name: Distributed PostgreSQL Runtime
on:
  push:
    branches: [feat/distributed-postgres-runtime, feat/distributed-postgres-execution-journal, feat/workflow-monitor-dashboard]
  pull_request:
    paths:
      - 'src/providers/WorkflowCore.Scaling.PostgreSQL/**'
      - 'src/WorkflowCore/**'
      - 'src/samples/WorkflowCore.Scaling.Api/**'
      - 'scaling/**'
      - 'monitor/**'
      - 'Makefile'
      - 'scaling/compose.monitor.yaml'
      - 'tests/WorkflowCore.Scaling.PostgreSQL.Tests/**'
      - '.github/workflows/distributed-runtime.yml'
  workflow_dispatch:

jobs:
  distributed-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_dev_only
          POSTGRES_DB: workflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      WFC_TEST_PG: Host=localhost;Port=5432;Database=workflow;Username=workflow;Password=workflow_dev_only
      PGPASSWORD: workflow_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply distributed runtime schema
        run: |
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/002_distributed_runtime.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/003_signal_delivery.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/004_request_dedupe.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/005_execution_history.sql
      - name: Build benchmark API
        run: dotnet build src/samples/WorkflowCore.Scaling.Api/WorkflowCore.Scaling.Api.csproj -c Release
      - name: Restore and test
        run: dotnet test tests/WorkflowCore.Scaling.PostgreSQL.Tests/WorkflowCore.Scaling.PostgreSQL.Tests.csproj -c Release --logger "console;verbosity=normal"

  monitor-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check-types
      - name: Build monitoring dashboard
        run: npm run build

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Makefile targets and Compose syntax
        run: |
          make help
          make -n bootstrap
          make -n dev
          docker compose -f scaling/compose.monitor.yaml config --quiet
      - name: Bootstrap complete local stack
        run: make bootstrap
      - name: Verify API starts against bootstrapped schema
        shell: bash
        run: |
          set -euo pipefail
          make api > /tmp/workflow-monitor-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          healthy=0
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:5000/health/ready; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            cat /tmp/workflow-monitor-api.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5000/api/monitor/overview
      - name: Stop local PostgreSQL
        if: always()
        run: make db-down
