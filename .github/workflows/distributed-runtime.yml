name: Distributed PostgreSQL Runtime
on:
  push:
    branches: [feat/distributed-postgres-runtime, feat/distributed-postgres-execution-journal, feat/workflow-monitor-dashboard, feat/workflow-definition-version-management]
  pull_request:
    paths:
      - 'src/providers/WorkflowCore.Scaling.PostgreSQL/**'
      - 'src/WorkflowCore/**'
      - 'src/samples/WorkflowCore.Scaling.Api/**'
      - 'src/samples/WorkflowCore.Scaling.Samples/**'
      - 'src/samples/WorkflowCore.Scaling.Worker/**'
      - 'scaling/**'
      - 'monitor/**'
      - 'Makefile'
      - 'scripts/**'
      - 'scaling/compose.monitor.yaml'
      - 'tests/WorkflowCore.Scaling.PostgreSQL.Tests/**'
      - '.github/workflows/distributed-runtime.yml'
  workflow_dispatch:

jobs:
  distributed-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_dev_only
          POSTGRES_DB: workflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      WFC_TEST_PG: Host=localhost;Port=5432;Database=workflow;Username=workflow;Password=workflow_dev_only
      PGPASSWORD: workflow_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply distributed runtime schema
        run: |
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/002_distributed_runtime.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/003_signal_delivery.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/004_request_dedupe.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/005_execution_history.sql
          psql -h localhost -U workflow -d workflow -v ON_ERROR_STOP=1 -f scaling/sql/006_definition_versions.sql
      - name: Build benchmark API
        run: dotnet build src/samples/WorkflowCore.Scaling.Api/WorkflowCore.Scaling.Api.csproj -c Release
      - name: Build standalone sample worker
        run: dotnet build src/samples/WorkflowCore.Scaling.Worker/WorkflowCore.Scaling.Worker.csproj -c Release
      - name: Restore and test
        run: dotnet test tests/WorkflowCore.Scaling.PostgreSQL.Tests/WorkflowCore.Scaling.PostgreSQL.Tests.csproj -c Release --logger "console;verbosity=normal"

  monitor-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check-types
      - name: Build monitoring dashboard
        run: npm run build
      - name: Test parallel trace layout and nested joins
        run: npm run test:topology

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PowerShell and Make wrappers
        run: |
          pwsh -NoProfile -File scripts/dev.ps1 help
          pwsh -NoProfile -File scripts/dev.ps1 check-tools -SkipDocker
          make help
          make -n bootstrap
          make -n dev
          docker compose -f scaling/compose.monitor.yaml config --quiet
      - name: Bootstrap complete local stack
        run: pwsh -NoProfile -File scripts/dev.ps1 bootstrap
      - name: Run dedicated worker and test sample onboarding end-to-end
        shell: bash
        env:
          WFC_ENABLE_MANAGEMENT_WRITES: 'true'
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/dev.ps1 api > /tmp/onboarding-api.log 2>&1 &
          api_pid=$!
          worker_pid=''
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:5000/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl --fail-with-body -sS http://127.0.0.1:5000/health/ready
          curl --fail-with-body -sS http://127.0.0.1:5000/api/monitor/overview
          pwsh -NoProfile -File scripts/dev.ps1 worker > /tmp/onboarding-worker.log 2>&1 &
          worker_pid=$!
          if ! pwsh -NoProfile -File scripts/test-onboarding.ps1 -TimeoutSeconds 90 || ! pwsh -NoProfile -File scripts/test-definition-management.ps1 -TimeoutSeconds 90; then
            echo 'API output:'
            tail -150 /tmp/onboarding-api.log
            echo 'Worker output:'
            tail -150 /tmp/onboarding-worker.log
            exit 1
          fi
      - name: Stop local PostgreSQL
        if: always()
        run: make db-down

  powershell-platform-check:
    name: PowerShell 7 cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PowerShell script and prerequisites
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/dev.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          pwsh -NoProfile -File scripts/dev.ps1 help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/dev.ps1 check-tools -SkipDocker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
