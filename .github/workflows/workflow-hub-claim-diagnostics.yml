name: Workflow Hub Claim Attribution (repeated 1 vs 4 shards)

on:
  pull_request:
    paths:
      - 'scaling/src/WorkflowCore.Hub/HubTaskStore.cs'
      - 'scaling/src/WorkflowCore.Hub/HubTelemetry.cs'
      - 'scaling/observability/benchmark/summarize_claim_diagnostics.py'
      - 'scaling/observability/compose.claim-diagnostics.yaml'
      - '.github/scripts/diagnose_hub_claims.py'
      - '.github/workflows/workflow-hub-claim-diagnostics.yml'
  workflow_dispatch:
    inputs:
      count:
        description: 'Unordered workflows per isolated scenario'
        default: '300'
        required: false

concurrency:
  group: workflow-hub-claim-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        batch_claims: ['false', 'true']
        shards: ['1', '4']
    env:
      COMPOSE: scaling/observability/compose.yaml
      HA: scaling/observability/compose.matching-ha.yaml
      SHARDS: scaling/observability/compose.matching-shards.yaml
      DIAG: scaling/observability/compose.claim-diagnostics.yaml
      ENVFILE: scaling/observability/.env.example
      WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS: ${{ matrix.batch_claims }}
      WFC_HUB_MATCHING_PARTITIONS: ${{ matrix.shards }}
      WFC_HUB_ADAPTIVE_CLAIMS: 'true'
      WFC_HUB_CLAIM_ADMISSION_ENABLED: 'true'
      WFC_HUB_COMPLETION_FAST_PATH_ENABLED: 'true'
      WFC_HUB_LONG_POLL_ENABLED: 'true'
      WFC_HUB_MATCHING_EVENT_GATED: 'true'
      WFC_HUB_DB_POOL: '12'
      OFFBOARD_PROCESSOR_WORKERS: '4'
      POLICY_BENCHMARK_ENABLED: 'true'
      POLICY_BENCH_ACTIVITY_WORKERS: '8'
      COUNT: ${{ github.event.inputs.count || '300' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check diagnostic scripts and compose
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/diagnose_hub_claims.py scaling/observability/benchmark/summarize_claim_diagnostics.py
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" config --quiet
          echo "Host cores: $(nproc); batch=$WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS shards=$WFC_HUB_MATCHING_PARTITIONS"
          cat /sys/fs/cgroup/cpu.max || true
      - name: Start two Hubs and instrumented PostgreSQL
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" up -d --build hub hub-2 hub-lb prometheus tempo loki
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5110/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5110/health/ready
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" exec -T postgres psql -X -U workflow -d workflow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
      - name: Repeat unordered claims, reversed processor order
        run: |
          set -euo pipefail
          mkdir -p scaling/observability/results/claim-diagnostics
          chmod 0777 scaling/observability/results scaling/observability/results/claim-diagnostics
          for trial in 1-1 1-4 1-16 2-16 2-4 2-1; do
            repeat="$(echo "$trial" | cut -d- -f1)"
            processors="$(echo "$trial" | cut -d- -f2)"
            tag="$WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS-$WFC_HUB_MATCHING_PARTITIONS-$repeat-$processors"
            run_id="claim-diagnostic-$tag-$GITHUB_RUN_ID"
            root="scaling/observability/results/claim-diagnostics"
            echo "::group::run=$run_id"
            docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" --profile offboarding-load up -d --build --no-deps --scale "processor=$processors" processor
            active="$(docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" --profile offboarding-load ps -q processor | wc -l | tr -d ' ')"
            test "$active" -eq "$processors"
            sleep 12
            python3 .github/scripts/diagnose_hub_claims.py prepare --output "$root/before-$tag.json"
            python3 .github/scripts/diagnose_hub_claims.py sample --output "$root/sample-$tag.json" --interval 1 &
            sampler_pid=$!
            set +e
            docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" --profile policy-k6 run --rm --no-deps -e K6_POLICY_MODE=unordered -e K6_POLICY_COUNT="$COUNT" -e K6_POLICY_VUS=60 -e K6_POLICY_TIMEOUT_SECONDS=600 -e K6_POLICY_RUN_ID="$run_id" k6-policy | tee "$root/k6-$tag.log"
            k6_rc=${PIPESTATUS[0]}
            set -e
            kill -TERM "$sampler_pid" 2>/dev/null || true
            wait "$sampler_pid" || true
            test "$k6_rc" -eq 0
            test -s "$root/sample-$tag.json"
            python3 scaling/observability/benchmark/verify_ordering.py --mode unordered --run-id "$run_id" --count "$COUNT" --output "$root/verify-$tag.json"
            sleep 7
            python3 .github/scripts/diagnose_hub_claims.py finish --before "$root/before-$tag.json" --sampler "$root/sample-$tag.json" --output "$root/diag-$tag.json"
            echo "::endgroup::"
          done
      - name: Upload all diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-claim-diagnostics-${{ matrix.batch_claims }}-${{ matrix.shards }}
          path: scaling/observability/results/claim-diagnostics/
          if-no-files-found: warn
      - name: Stop diagnostic services
        if: always()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" -f "$DIAG" --env-file "$ENVFILE" --profile offboarding-load --profile policy-k6 down --remove-orphans || true

  compare:
    needs: [profile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all shard and claim-mode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hub-claim-diagnostics-*
          path: diagnostics
          merge-multiple: true
      - name: Compare medians and SQL/CPU attribution
        run: |
          set -euo pipefail
          python3 scaling/observability/benchmark/summarize_claim_diagnostics.py --input diagnostics --output diagnostics/comparison.md --expected 24
          cat diagnostics/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-claim-diagnostics-comparison
          path: |
            diagnostics/comparison.md
            diagnostics/comparison.csv
          if-no-files-found: warn
