name: Workflow Hub Native Completion SQL A/B

# Isolated experiment: only native activity completion write round trips vary.
# Baseline is the same PR #42 code with combined completion disabled.
on:
  workflow_dispatch:
  pull_request:
    branches: ['experiment/optimistic-hub-owner-admission']
    paths:
      - 'scaling/src/WorkflowCore.Hub/**'
      - 'scaling/observability/compose*.yaml'
      - '.github/workflows/workflow-hub-native-completion-sql-ab.yml'

concurrency:
  group: workflow-hub-completion-sql-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-completion-ab:
    name: ${{ matrix.completion_mode }} / ${{ matrix.processors }} processors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        completion_mode: [legacy, combined]
        processors: [4, 8, 16]
    env:
      BENCH_PROCESSORS: ${{ matrix.processors }}
      BENCH_COMPLETION_MODE: ${{ matrix.completion_mode }}
      WFC_HUB_OPTIMISTIC_OWNER_ADMISSION: 'false'
      WFC_HUB_COMBINED_ACTIVITY_COMPLETION: ${{ matrix.completion_mode == 'combined' }}
      COMPOSE: scaling/observability/compose.yaml
      HA: scaling/observability/compose.matching-ha.yaml
      SHARDS: scaling/observability/compose.matching-shards.yaml
      ENVFILE: scaling/observability/.env.example
      WFC_HUB_PUSH_ENABLED: 'true'
      WFC_HUB_MATCHING_CANDIDATES_ENABLED: 'true'
      WFC_HUB_TASK_SSE_PUSH: 'false'
      WFC_HUB_WORKER_CAPACITY_FANOUT: 'false'
      WFC_HUB_MATCHING_PARTITIONS: '4'
      WFC_HUB_CLAIM_ADMISSION_ENABLED: 'true'
      WFC_HUB_CLAIM_ADMISSION_MODE: 'demand'
      WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS: 'true'
      WFC_HUB_VERIFY_URL: 'http://127.0.0.1:5110'
      OFFBOARD_PROCESSOR_WORKERS: '8'
      POLICY_BENCHMARK_ENABLED: 'true'
      POLICY_BENCHMARK_ONLY: 'true'
      POLICY_BENCH_ACTIVITY_WORKERS: '8'
      K6_POLICY_MODE: 'unordered'
      K6_POLICY_COUNT: '1000'
      K6_POLICY_VUS: '200'
      K6_POLICY_TIMEOUT_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4

      - name: Record runner capacity and validate Compose overlays
        run: |
          set -euo pipefail
          echo "CPU cores: $(nproc)"
          free -h
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" config --quiet
          echo "RUN_ID=native-completion-$BENCH_COMPLETION_MODE-$BENCH_PROCESSORS-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p scaling/observability/results/sse-stress-1000-16
          chmod 0777 scaling/observability/results scaling/observability/results/sse-stress-1000-16

      - name: Start two Hub replicas and shared PostgreSQL
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" up -d --build hub hub-2 hub-lb prometheus
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5110/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail-with-body -fsS http://127.0.0.1:5110/health/ready

      - name: Start selected native offboarding processors with SSE push
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            up -d --build --no-deps --scale processor="$BENCH_PROCESSORS" processor
          count="$(docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load ps -q processor | wc -l | tr -d ' ')"
          echo "Processor containers running: $count (expected $BENCH_PROCESSORS)"
          test "$count" -eq "$BENCH_PROCESSORS"
          token="$(grep '^WFC_HUB_AUTH_TOKEN=' "$ENVFILE" | cut -d= -f2-)"
          for i in {1..90}; do
            if curl -fsS -H "Authorization: Bearer $token" \
              http://127.0.0.1:5100/api/hub/workers/transport-diagnostics > /tmp/stress-hub-a.json &&
              docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
                exec -T hub-lb wget -q -O - --header "Authorization: Bearer $token" \
                http://hub-2:5100/api/hub/workers/transport-diagnostics > /tmp/stress-hub-b.json &&
              jq -e -s --argjson expected "$BENCH_PROCESSORS" '(all(.[]; .candidateEnabled == true)) and ((map(.pushConnected) | add) >= $expected)' \
                /tmp/stress-hub-a.json /tmp/stress-hub-b.json > /dev/null; then
              break
            fi
            sleep 2
          done
          jq -e -s --argjson expected "$BENCH_PROCESSORS" '(all(.[]; .candidateEnabled == true)) and ((map(.pushConnected) | add) >= $expected)' \
            /tmp/stress-hub-a.json /tmp/stress-hub-b.json
          echo "PASS: $BENCH_PROCESSORS registered sessions; completion mode $BENCH_COMPLETION_MODE"

      - name: Run 1,000 native workflows with 1 routed activity each
        run: |
          set -euo pipefail
          out=scaling/observability/results/sse-stress-1000-16
          python3 .github/scripts/sample_dispatch_pressure.py \
            --output "$out/pressure.json" --interval 1 > "$out/pressure.log" 2>&1 &
          probe=$!
          finish() {
            kill -TERM "$probe" 2>/dev/null || true
            wait "$probe" || true
          }
          trap finish EXIT
          sleep 2
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile policy-k6 \
            run --rm --no-deps \
            -e K6_POLICY_MODE=unordered \
            -e K6_POLICY_COUNT=1000 \
            -e K6_POLICY_VUS=200 \
            -e K6_POLICY_TIMEOUT_SECONDS=900 \
            -e K6_POLICY_RUN_ID="$RUN_ID" \
            k6-policy 2>&1 | tee "$out/k6.log"
          finish
          trap - EXIT
          cp scaling/observability/results/k6-summary.json "$out/k6-summary.json"
          test -s "$out/pressure.json"

      - name: Verify 1,000 durable activity completions and output metrics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          root=pathlib.Path("scaling/observability/results/sse-stress-1000-16")
          token=next(row.partition("=")[2].strip() for row in
              pathlib.Path("scaling/observability/.env.example").read_text().splitlines()
              if row.startswith("WFC_HUB_AUTH_TOKEN="))
          run=os.environ["RUN_ID"]
          url="http://127.0.0.1:5110/api/hub/runs/"+run+"/summary"
          with urllib.request.urlopen(urllib.request.Request(
              url,headers={"Authorization":"Bearer "+token}),timeout=45) as response:
              result=json.load(response)
          assert result["total"]==result["completed"]==1000 and result["failed"]==0, result
          # Without this check the workload could complete entirely through
          # workflow-local steps and never exercise CompleteActivityAsync.
          import subprocess
          cmd=["docker","compose","-f",os.environ["COMPOSE"],"-f",os.environ["HA"],
               "-f",os.environ["SHARDS"],"--env-file",os.environ["ENVFILE"],
               "exec","-T","postgres","psql","-U","workflow","-d","workflow","-Atc",
               "SELECT count(*) FROM wfc_scale.hub_workflow_event e "
               "JOIN wfc_scale.hub_workflow w ON e.workflow_id=w.id "
               "WHERE w.run_id='"+run+"' AND e.event_type='ActivityResultReceived'"]
          activity_count=int(subprocess.check_output(cmd,text=True).strip())
          assert activity_count==1000, "Native activity completion coverage: "+str(activity_count)
          from datetime import datetime
          def ts(value): return datetime.fromisoformat(value.replace("Z","+00:00"))
          elapsed=(ts(result["lastCompletedAt"])-ts(result["firstCreatedAt"])).total_seconds()
          pressure=json.loads((root/"pressure.json").read_text())
          commits=(pressure.get("dbDelta") or {}).get("xact_commit")
          report={
              "runId":run,"transport":"partition-candidate-matching+SSE",
              "nativeCompletionWriteMode":os.environ["BENCH_COMPLETION_MODE"],
              "hubs":2,"matchingShards":4,"processorReplicas":int(os.environ["BENCH_PROCESSORS"]),
              "workflowSlotsPerProcessor":8,"k6VUs":200,"submitted":result["total"],
              "completed":result["completed"],"failed":result["failed"],
              "nativeActivityResultsPersisted":activity_count,
              "workflowType":"policy-unordered","elapsedSeconds":round(elapsed,3),
              "workflowThroughputPerSecond":round(1000/elapsed,3),
              "workflowP95Ms":result["p95CompletionMs"],"workflowP99Ms":result["p99CompletionMs"],
              "cpuBusyPercent":pressure.get("hostCpuBusyPercent"),
              "pgCommitsPerWorkflow":None if commits is None else round(commits/1000,3),
              "postgresWaitSamples":pressure.get("sampledPgWaitBackendCounts"),
              "samplerErrors":pressure.get("errors"),
              "limitations":"Shared GitHub runner CPU; no separate matched-worker baseline; CPU includes Hub, PostgreSQL, k6 and processors"
          }
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload stress logs and PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-native-completion-${{ matrix.completion_mode }}-${{ matrix.processors }}
          path: scaling/observability/results/sse-stress-1000-16/
          if-no-files-found: warn

      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            ps -a || true
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            logs --tail=150 hub hub-2 hub-lb processor postgres || true

      - name: Cleanup without deleting PostgreSQL volumes
        if: always()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" \
            --env-file "$ENVFILE" --profile offboarding-load \
            --profile policy-k6 down --remove-orphans || true
