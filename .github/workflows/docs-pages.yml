name: Documentation (GitHub Pages)

on:
  pull_request:
    branches: [master, 'thanhhaictld/hub-memory-candidates-luna']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/check_docs_site.py'
      - 'scripts/check_mermaid_output.py'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/check_docs_site.py'
      - 'scripts/check_mermaid_output.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Validate documentation navigation and links
        run: python scripts/check_docs_site.py
      - name: Build MkDocs site
        run: mkdocs build --clean
      - name: Verify Mermaid diagrams in generated HTML
        run: python scripts/check_mermaid_output.py
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
