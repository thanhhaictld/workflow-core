name: Hub Candidate Matching + SSE Failover

on:
  pull_request:
    paths:
      - 'scaling/src/WorkflowCore.Hub/**'
      - 'scaling/src/WorkflowCore.Hub.Gateway/**'
      - 'scaling/src/WorkflowCore.RemoteExecution/**'
      - 'scaling/benchmarks/hub-*failover*'
      - 'scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/**'
      - 'scaling/observability/**'
      - '.github/workflows/workflow-hub-candidate-sse-failover.yml'
  workflow_dispatch:

jobs:
  candidate-sse-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_dev_only
          POSTGRES_DB: workflow
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Prepare isolated Hub schema including candidate indexes
        env:
          PGPASSWORD: workflow_dev_only
        shell: bash
        run: |
          set -euo pipefail
          for migration in scaling/sql/[0-9][0-9][0-9]_*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -p 55432 -U workflow -d workflow -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Build Hub and Provisioner
        run: dotnet build scaling/WorkflowCore.Scaling.slnx -c Release
      - name: Assert candidate matching and SSE ownership failover
        env:
          WFC_PUSH_FAILOVER_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          WFC_PUSH_FAILOVER_PGPORT: '55432'
        shell: pwsh
        run: |
          ./scaling/benchmarks/hub-matching-failover-suite.ps1
      - name: Upload failover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-sse-failover-results
          path: scaling/benchmarks/results/push-local/failover-suite/
          if-no-files-found: warn
