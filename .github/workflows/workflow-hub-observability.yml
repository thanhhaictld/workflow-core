name: Workflow Hub Candidate + SSE Observability Smoke

on:
  pull_request:
    paths:
      - 'scaling/observability/**'
      - 'scaling/src/WorkflowCore.Hub.Gateway/**'
      - 'scaling/src/WorkflowCore.Hub.Telemetry/**'
      - 'scaling/src/WorkflowCore.RemoteExecution/**'
      - 'scaling/monitor/**'
      - '.github/workflows/workflow-hub-observability.yml'
  workflow_dispatch:

concurrency:
  group: workflow-hub-otel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-otel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: scaling/observability/compose.yaml
      HA: scaling/observability/compose.matching-ha.yaml
      SHARDS: scaling/observability/compose.matching-shards.yaml
      ENVFILE: scaling/observability/.env.example
      WFC_HUB_PUSH_ENABLED: 'true'
      WFC_HUB_MATCHING_CANDIDATES_ENABLED: 'true'
      WFC_HUB_TASK_SSE_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTEL dashboards and primary topology
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < scaling/observability/k6/offboarding-unconstrained.js
          python3 - <<'PY'
          import json
          p="scaling/observability/grafana/dashboards/workflow-hub-runtime.json"
          panels=json.load(open(p))["panels"]
          assert len(panels) >= 16
          metrics=json.dumps(panels)
          assert "workflow_hub_candidate_credits" in metrics
          assert "workflow_hub_candidate_reservations" in metrics
          assert "workflow_hub_worker_inflight" in metrics
          assert "workflow_hub_candidate_capacity_fallbacks_total" in metrics
          print("PASS: primary matcher, worker occupancy and fallback panels")
          PY
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" config --quiet

      - name: Start two Hub owners, Prometheus, Grafana and monitoring UI
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            up -d --build hub hub-2 hub-lb prometheus grafana monitor
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:5110/health/ready >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:9090/-/ready >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:3002/api/hub-overview >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl --fail-with-body -fsS http://127.0.0.1:5110/health/ready
          curl --fail-with-body -fsS http://127.0.0.1:9090/-/ready
          curl --fail-with-body -fsS http://127.0.0.1:3001/api/health
          curl --fail-with-body -fsS http://127.0.0.1:3002/api/hub-overview > /tmp/hub-monitor-overview.json
          curl --fail-with-body -fsS -u admin:local-grafana-change-this \
            http://127.0.0.1:3001/api/dashboards/uid/workflow-hub-otel > /tmp/otel-dashboard.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/otel-dashboard.json'))
          panels=json.dumps(x['dashboard']['panels'])
          assert "workflow_hub_candidate_credits" in panels
          assert "workflow_hub_worker_inflight" in panels
          hub=json.load(open('/tmp/hub-monitor-overview.json'))
          assert isinstance(hub.get('runs'),list)
          print('PASS: Grafana candidate panels and live Next.js Hub proxy')
          PY

      - name: Verify live SSE workers and candidate occupancy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            --profile offboarding-load up -d --build --no-deps --scale processor=2 processor
          token="$(grep '^WFC_HUB_AUTH_TOKEN=' "$ENVFILE" | cut -d= -f2-)"
          for i in {1..80}; do
            if curl -fsS -H "Authorization: Bearer $token" \
              http://127.0.0.1:5100/api/hub/workers/transport-diagnostics > /tmp/otel-hub-a.json &&
              docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
                exec -T hub-lb wget -q -O - --header "Authorization: Bearer $token" \
                http://hub-2:5100/api/hub/workers/transport-diagnostics > /tmp/otel-hub-b.json &&
              jq -e -s '(all(.[]; .candidateEnabled == true)) and ((map(.pushConnected) | add) >= 2)' \
                /tmp/otel-hub-a.json /tmp/otel-hub-b.json > /dev/null; then
              break
            fi
            sleep 2
          done
          jq -e -s '(all(.[]; .candidateEnabled == true)) and ((map(.pushConnected) | add) >= 2)' \
            /tmp/otel-hub-a.json /tmp/otel-hub-b.json
          curl --fail-with-body -fsS \
            'http://127.0.0.1:9090/api/v1/query?query=up' > /tmp/otel-targets.json
          jq -e '.status == "success" and (.data.result | length) > 0' /tmp/otel-targets.json
          echo 'PASS: candidate owner sessions, PostgreSQL-backed Hub and Prometheus scrape targets'

      - name: Print service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            --profile offboarding-load logs --tail=160 hub hub-2 hub-lb processor prometheus grafana monitor || true
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            --profile offboarding-load down --remove-orphans || true
