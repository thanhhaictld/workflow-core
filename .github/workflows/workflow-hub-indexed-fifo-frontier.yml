name: Workflow Hub Indexed FIFO Frontier E2E — 1k OFF-ON-OFF

on:
  pull_request:
    paths:
      - 'scaling/**'
      - '.github/workflows/workflow-hub-indexed-fifo-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexed-fifo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fifo-frontier-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      WFC_OBSERVABILITY_PROJECT: wfc-frontier-${{ github.run_id }}
      WFC_HUB_INDEXED_FIFO_FRONTIER_ENABLED: 'false'
      WFC_HUB_FIFO_HEAD_PREFILTER_ENABLED: 'false'
      WFC_HUB_BATCH_UNCONSTRAINED_CLAIMS: 'true'
      WFC_HUB_MATCHING_SCOPED_CLAIMS: 'true'
      WFC_HUB_MATCHING_EVENT_GATED: 'true'
      WFC_HUB_LONG_POLL_ENABLED: 'true'
      WFC_HUB_CLAIM_ADMISSION_ENABLED: 'true'
      WFC_HUB_CLAIM_ADMISSION_MODE: demand
      WFC_HUB_CLAIM_ADMISSION_LIMIT: '3'
      WFC_HUB_WORKER_CAPACITY_FANOUT: 'false'
      POLICY_BENCHMARK_ENABLED: 'true'
      POLICY_BENCHMARK_ONLY: 'true'
      POLICY_BENCH_ACTIVITY_WORKERS: '8'
      OFFBOARD_PROCESSOR_WORKERS: '4'
      COUNT: '1000'
      COMPOSE: scaling/observability/compose.yaml
      HA: scaling/observability/compose.matching-ha.yaml
      SHARDS: scaling/observability/compose.matching-shards.yaml
      ENVFILE: scaling/observability/.env.example
      WFC_HUB_VERIFY_URL: http://127.0.0.1:5110
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark scripts and Compose
        run: |
          set -euo pipefail
          python3 -m py_compile scaling/observability/benchmark/verify_ordering.py scaling/observability/benchmark/compare_fifo_frontier_1000.py
          node --input-type=module --check < scaling/observability/k6/partition-ordering.js
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" config --quiet

      - name: Start isolated PostgreSQL and two matching Hubs
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" up -d --build hub hub-2 hub-lb prometheus
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:5110/health/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5110/health/ready
          # The backfilled partial-index schema must be present before tests.
          count="$(docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            exec -T postgres psql -U workflow -d workflow -Atc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='wfc_scale' AND indexname='ix_hub_fifo_pending_head';")"
          test "$count" = 1

      - name: PostgreSQL concurrency, strict FIFO, and lease-fencing regression suite
        run: |
          set -euo pipefail
          docker run --rm --network "${WFC_OBSERVABILITY_PROJECT}_default" \
            -v "$PWD:/repo" -w /repo \
            -e 'WFC_TEST_PG=Host=postgres;Port=5432;Database=workflow;Username=workflow;Password=workflow_dev_only' \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test scaling/tests/WorkflowCore.Scaling.PostgreSQL.Tests/WorkflowCore.Scaling.PostgreSQL.Tests.csproj -c Release \
              --filter "FullyQualifiedName~HubIndexedFifoFrontierTests|FullyQualifiedName~HubFifoHeadPrefilterTests|FullyQualifiedName~HubExplicitOrderingTests|FullyQualifiedName~HubUnconstrainedBatchClaimTests" \
              --logger "console;verbosity=normal"

      - name: Start eight DB-free processors
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            --profile offboarding-load up -d --build --no-deps --scale processor=8 processor
          token="$(grep '^WFC_HUB_AUTH_TOKEN=' "$ENVFILE" | cut -d= -f2-)"
          for i in {1..60}; do
            if curl -fsS -H "Authorization: Bearer $token" \
              http://127.0.0.1:5110/api/hub/definitions >/tmp/definitions.json && \
              python3 - <<'PY'
          import json
          data=json.load(open('/tmp/definitions.json'))
          assert {'policy-unordered','policy-partition-fifo','policy-keyed-fifo'}.issubset(
            {x['definitionId'] for x in data if x['hubId']=='policy-benchmark'})
          PY
            then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/definitions.json'))
          assert {'policy-unordered','policy-partition-fifo','policy-keyed-fifo'}.issubset(
            {x['definitionId'] for x in data if x['hubId']=='policy-benchmark'})
          PY

      - name: Same-run OFF then ON then OFF — 1,000 workflows per policy per phase
        run: |
          set -euo pipefail
          root="scaling/observability/results/fifo-frontier"
          mkdir -p "$root"
          chmod 0777 scaling/observability/results "$root"

          for stage in off_a on off_b; do
            case "$stage" in
              on) export WFC_HUB_INDEXED_FIFO_FRONTIER_ENABLED=true ;;
              *) export WFC_HUB_INDEXED_FIFO_FRONTIER_ENABLED=false ;;
            esac
            echo "::group::Hub stage $stage; indexed frontier=$WFC_HUB_INDEXED_FIFO_FRONTIER_ENABLED"
            # Always restart BOTH Hub replicas. The worker set, PostgreSQL, and
            # runner remain unchanged; avoid cross-runner capacity comparisons.
            docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
              up -d --no-deps --force-recreate hub hub-2
            for i in {1..90}; do
              if curl -fsS http://127.0.0.1:5110/health/ready >/dev/null 2>&1; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:5110/health/ready
            for svc in hub hub-2; do
              observed="$(docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
                exec -T "$svc" printenv WFC_HUB_INDEXED_FIFO_FRONTIER_ENABLED | tr -d '\r')"
              test "$observed" = "$WFC_HUB_INDEXED_FIFO_FRONTIER_ENABLED"
            done
            sleep 8
            echo "::endgroup::"

            docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
              exec -T postgres psql -U workflow -d workflow -Atc \
              "SELECT row_to_json(stats) FROM (
                SELECT xact_commit,tup_inserted,tup_updated,blks_hit,blks_read
                FROM pg_stat_database WHERE datname=current_database()
              ) stats" > "$root/db-before-$stage.json"

            for mode in unordered partition keyed; do
              run="frontier-${stage}-${mode}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "::group::stage=$stage policy=$mode count=$COUNT"
              K6_POLICY_MODE="$mode" docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
                --profile policy-k6 run --rm --no-deps \
                -e K6_POLICY_MODE="$mode" \
                -e K6_POLICY_COUNT="$COUNT" -e K6_POLICY_VUS=60 \
                -e K6_POLICY_TIMEOUT_SECONDS=1500 \
                -e K6_POLICY_RUN_ID="$run" k6-policy \
                | tee "$root/k6-$stage-$mode.log"
              cp scaling/observability/results/k6-policy-summary.json "$root/k6-$stage-$mode.json"
              python3 scaling/observability/benchmark/verify_ordering.py \
                --mode "$mode" --run-id "$run" --count "$COUNT" \
                --output "$root/verify-$stage-$mode.json"
              echo "::endgroup::"
            done

            docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
              exec -T postgres psql -U workflow -d workflow -Atc \
              "SELECT row_to_json(stats) FROM (
                SELECT xact_commit,tup_inserted,tup_updated,blks_hit,blks_read
                FROM pg_stat_database WHERE datname=current_database()
              ) stats" > "$root/db-after-$stage.json"
          done

      - name: Compare throughput and p95/p99 with control drift
        run: |
          set -euo pipefail
          python3 scaling/observability/benchmark/compare_fifo_frontier_1000.py \
            --root scaling/observability/results/fifo-frontier \
            --count "$COUNT" --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload test and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-fifo-1000-off-on-off
          path: scaling/observability/results/fifo-frontier/*
          if-no-files-found: warn

      - name: Inspect failure logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            logs --tail=250 hub hub-2 postgres processor || true

      - name: Shutdown isolated test environment
        if: always()
        run: |
          docker compose -f "$COMPOSE" -f "$HA" -f "$SHARDS" --env-file "$ENVFILE" \
            down --remove-orphans -v || true
